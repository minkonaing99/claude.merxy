<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__T__</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--mut:#66645e;--card:#fff;--line:#e3e0d8;--ok:#1d7a3a;--bad:#b3261e;--hi:#fff3c4}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#a3a19a;--card:#21211e;--line:#36352f;--ok:#6fd08f;--bad:#ff8a80;--hi:#4a3f12}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:1.7rem;margin:.2em 0}
h2{font-size:1.25rem;margin-top:2.2em;border-bottom:2px solid var(--line);padding-bottom:.3em}
.sub{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.why{border-left:4px solid var(--bad)}
.rule{border-left:4px solid var(--ok)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bg)}
mark{background:var(--hi);color:inherit;padding:0 3px;border-radius:3px}
.q{margin:18px 0}
.q p{font-weight:600;margin:.2em 0 .5em}
.q button{display:block;width:100%;text-align:left;margin:5px 0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.q button.right{outline:2px solid var(--ok)}
.q button.wrong{outline:2px solid var(--bad)}
.fb{font-size:.95rem;margin-top:6px}
.score{position:sticky;top:0;background:var(--bg);padding:8px 0;font-weight:600;border-bottom:1px solid var(--line)}
pre{overflow-x:auto;background:var(--card);border:1px solid var(--line);padding:10px;border-radius:8px}
</style>
</head><body>
